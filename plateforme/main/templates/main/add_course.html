{% extends 'main/base.html' %} 
{% load static %} 
{% block content %}

<h2 class="text-2xl font-bold mb-4">Ajouter un cours depuis YouTube</h2>

<form method="POST" class="bg-white rounded-[32px] border border-slate-200 shadow-sm p-8 space-y-6">
    {% csrf_token %}
    <div>
      <label class="block mb-2 text-sm font-semibold text-slate-700">Lien YouTube :</label>
      <input type="url" name="youtube_url" class="border border-slate-200 rounded-2xl p-4 w-full" required>
    </div>

    <div>
      <label class="block mb-2 text-sm font-semibold text-slate-700">Catégorie :</label>
      <select name="category" class="border border-slate-200 rounded-2xl p-4 w-full" required>
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="button-primary">Ajouter le cours</button>
</form>

{% endblock %}
