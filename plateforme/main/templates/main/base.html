<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% block title %}
    <title>Kha Learning - Formation en ligne</title>
    {% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-soft: #f1f5f9;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --accent: #ea580c;
        --accent-soft: rgba(234, 88, 12, 0.12);
        --shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        max-width: 100%;
        display: block;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      .page-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .section-heading {
        font-size: clamp(2rem, 2.8vw, 2.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 16px;
        color: #0f172a;
      }
      .section-copy {
        color: var(--muted);
        max-width: 720px;
        line-height: 1.8;
        margin-bottom: 32px;
      }
      .site-card {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 32px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
        overflow: hidden;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }
      .site-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 26px 70px rgba(15, 23, 42, 0.10);
        border-color: rgba(234, 88, 12, 0.16);
      }
      .site-card-body {
        padding: 28px;
      }
      .site-card-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 12px;
        line-height: 1.2;
      }
      .site-card-text {
        color: #475569;
        line-height: 1.9;
        margin-bottom: 18px;
      }
      .site-card-meta {
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 24px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #fb923c);
        color: #fff;
        font-weight: 700;
        box-shadow: 0 18px 40px rgba(234, 88, 12, 0.24);
        transition: transform 0.2s ease;
      }
      .button-primary:hover {
        transform: translateY(-1px);
      }
      .button-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 24px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(251, 146, 60, 0.08);
        color: var(--text);
        font-weight: 600;
        transition: background 0.2s ease, transform 0.2s ease;
      }
      .button-secondary:hover {
        background: rgba(251, 146, 60, 0.14);
        transform: translateY(-1px);
      }
      .dark body {
        background: #020617;
        color: #e2e8f0;
      }
      .dark .bg-white,
      .dark .bg-gray-50,
      .dark .bg-gray-100 {
        background-color: #0f172a !important;
      }
      .dark .bg-slate-50,
      .dark .bg-slate-100,
      .dark .bg-slate-200 {
        background-color: #111827 !important;
      }
      .dark .bg-orange-100 {
        background-color: rgba(245, 158, 11, 0.14) !important;
      }
      .dark .border-slate-200,
      .dark .border-slate-300,
      .dark .border-slate-100,
      .dark .border-gray-200,
      .dark .border-gray-300,
      .dark .border-gray-100 {
        border-color: rgba(148, 163, 184, 0.18) !important;
      }
      .dark h1,
      .dark h2,
      .dark h3,
      .dark h4,
      .dark h5,
      .dark h6,
      .dark .section-heading,
      .dark .site-card-title,
      .dark .text-slate-900,
      .dark .text-gray-900,
      .dark .text-slate-800,
      .dark .text-gray-800,
      .dark .text-slate-700,
      .dark .text-gray-700,
      .dark .text-slate-600,
      .dark .text-gray-600,
      .dark .text-slate-500,
      .dark .text-gray-500,
      .dark .text-slate-400,
      .dark .text-gray-400,
      .dark .text-black {
        color: #f8fafc !important;
      }
      .dark p,
      .dark span,
      .dark li,
      .dark label,
      .dark .text-muted,
      .dark .section-copy {
        color: #cbd5e1 !important;
      }
      .dark .site-card {
        background: rgba(15, 23, 42, 0.95);
        border-color: rgba(148, 163, 184, 0.16);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      }
      .dark .site-card-title {
        color: #f8fafc;
      }
      .dark .site-card-text,
      .dark .site-card-meta,
      .dark .section-copy,
      .dark .text-muted {
        color: #cbd5e1;
      }
      .dark .button-secondary {
        background: rgba(251, 146, 60, 0.12);
        color: #f8fafc;
        border-color: rgba(148, 163, 184, 0.18);
      }
      .dark .button-secondary:hover {
        background: rgba(251, 146, 60, 0.18);
      }
      .dark .border-transparent {
        border-color: transparent !important;
      }
      .dark .shadow-sm {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25) !important;
      }
      .dark .shadow-xl {
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35) !important;
      }
      .section-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        background: rgba(251, 146, 60, 0.12);
        color: var(--accent);
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        font-weight: 700;
      }
      .text-muted {
        color: var(--muted);
      }
      .bg-surface {
        background: var(--surface);
      }
      .bg-surface-soft {
        background: var(--surface-soft);
      }
      .border-soft {
        border-color: var(--border);
      }
    </style>
  </head>
  <body>
    {% include 'main/navbar.html' %}

    <a href="{% url 'assistant' %}" class="fixed right-5 bottom-5 z-50 inline-flex items-center gap-3 rounded-full bg-orange-600 px-5 py-4 text-sm font-semibold text-white shadow-2xl shadow-orange-500/30 transition duration-200 hover:bg-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-300">
      <i class="fa-solid fa-robot"></i>
      Kha IA
    </a>

    {% block content %}{% endblock %}
    {% include 'main/footer.html' %}
  </body>
</html>
